[project]
name = "ronten-api"
version = "0.1.0"
description = "ronten Django API - 3-line summary backend"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "django-cors-headers>=4.4",
    "djangorestframework>=3.15",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
